<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Simulación de Hormigas</title>
  <style>
    canvas { border: 1px solid #ccc; background: #f8f8f8; }
  </style>
</head>
<body>
  <canvas id="antCanvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById('antCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    const nest = { x: width / 2, y: height / 2 };
    const foods = [
      { x: 80, y: 80, r: 6, amount: 100 },
      { x: 520, y: 320, r: 6, amount: 100 }
    ];

    const NUM_ANTS = 80;
    const SPEED = 1.2;
    const TURN_RATE = 0.3;
    const PHEROMONE_STRENGTH = 40;
    const EVAPORATION = 0.95;
    const gridSize = 4;
    const cols = Math.ceil(width / gridSize);
    const rows = Math.ceil(height / gridSize);
    const pheromones = Array.from({ length: cols }, () => Array(rows).fill(0));

    function Ant() {
      this.x = nest.x;
      this.y = nest.y;
      this.angle = Math.random() * Math.PI * 2;
      this.carrying = false;
    }

    const ants = Array.from({ length: NUM_ANTS }, () => new Ant());

    function deposit(x, y, amount) {
      const c = Math.floor(x / gridSize);
      const r = Math.floor(y / gridSize);
      if (c >= 0 && c < cols && r >= 0 && r < rows) {
        pheromones[c][r] += amount;
      }
    }

    function sense(x, y) {
      const c = Math.floor(x / gridSize);
      const r = Math.floor(y / gridSize);
      if (c >= 0 && c < cols && r >= 0 && r < rows) {
        return pheromones[c][r];
      }
      return 0;
    }

    function evaporate() {
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          pheromones[c][r] *= EVAPORATION;
        }
      }
    }

    function updateAnt(ant) {
      const { x, y } = ant;

      // sensing ahead
      const sensorDist = 10;
      const angles = [0, -0.5, 0.5];
      const senses = angles.map(a => {
        const sx = x + Math.cos(ant.angle + a) * sensorDist;
        const sy = y + Math.sin(ant.angle + a) * sensorDist;
        return sense(sx, sy);
      });

      if (!ant.carrying) {
        // follow pheromone
        const max = Math.max(...senses);
        const idx = senses.indexOf(max);
        if (max > 0) {
          ant.angle += angles[idx] * 0.5;
        } else {
          ant.angle += (Math.random() - 0.5) * TURN_RATE;
        }
      } else {
        // move towards nest
        const dirNest = Math.atan2(nest.y - y, nest.x - x);
        ant.angle += (dirNest - ant.angle) * 0.1;
        deposit(x, y, PHEROMONE_STRENGTH);
      }

      ant.x += Math.cos(ant.angle) * SPEED;
      ant.y += Math.sin(ant.angle) * SPEED;

      // boundaries
      if (ant.x < 0) ant.x = 0;
      if (ant.x > width) ant.x = width;
      if (ant.y < 0) ant.y = 0;
      if (ant.y > height) ant.y = height;

      // food detection
      if (!ant.carrying) {
        for (const f of foods) {
          const dx = ant.x - f.x;
          const dy = ant.y - f.y;
          if (f.amount > 0 && Math.hypot(dx, dy) < f.r) {
            ant.carrying = true;
            f.amount -= 1;
            break;
          }
        }
      } else {
        const dx = ant.x - nest.x;
        const dy = ant.y - nest.y;
        if (Math.hypot(dx, dy) < 8) {
          ant.carrying = false;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // draw pheromones
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const p = pheromones[c][r];
          if (p > 1) {
            ctx.fillStyle = `rgba(160,0,255,${Math.min(p / PHEROMONE_STRENGTH, 0.3)})`;
            ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
          }
        }
      }

      // draw nest
      ctx.fillStyle = 'brown';
      ctx.beginPath();
      ctx.arc(nest.x, nest.y, 6, 0, Math.PI * 2);
      ctx.fill();

      // draw food
      for (const f of foods) {
        if (f.amount > 0) {
          ctx.fillStyle = 'green';
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // draw ants
      ctx.fillStyle = 'black';
      for (const ant of ants) {
        ctx.beginPath();
        ctx.arc(ant.x, ant.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function step() {
      evaporate();
      ants.forEach(updateAnt);
      draw();
      requestAnimationFrame(step);
    }

    step();
  </script>
</body>
</html>
